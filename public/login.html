<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Feed hub · sign in</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --panel: #131a26;
        --line: #232e40;
        --text: #e6edf7;
        --muted: #8496b0;
        --accent: #7c8cff;
        --down: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      form {
        width: 100%;
        max-width: 340px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px 24px;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      p.sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: var(--muted);
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0e141e;
        color: var(--text);
        font-size: 14px;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: transparent;
      }
      button {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #0b0f17;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .error {
        background: rgb(248 113 113 / 0.12);
        border: 1px solid rgb(248 113 113 / 0.35);
        color: var(--down);
        border-radius: 10px;
        padding: 8px 11px;
        font-size: 13px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>Feed hub</h1>
      <p class="sub">Sign in to view the monitor.</p>

      <!--ERROR-->

      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autofocus required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
