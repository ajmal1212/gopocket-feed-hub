services:
  feed-hub:
    build: .
    # Or, once you publish an image, replace `build` with:
    # image: ghcr.io/<org>/gopocket-feed-hub:latest
    container_name: feed-hub
    restart: unless-stopped

    environment:
      # Upstream feed. One live session per account: whoever connects last
      # wins, so this account must belong to the hub alone. Point a second
      # environment at the same account and one of them goes dark.
      NOREN_WS_URL: ${NOREN_WS_URL:-wss://skypro.skybroking.com/NorenWSWeb/}
      NOREN_REST_URL: ${NOREN_REST_URL:-https://skypro.skybroking.com}

      # The session key rotates daily in Frappe; the hub reads it on every
      # connect. Only this API token is long-lived.
      FRAPPE_URL: ${FRAPPE_URL:-https://pulse.gopocket.in}
      FRAPPE_TOKEN: ${FRAPPE_TOKEN:?set FRAPPE_TOKEN}

      # Daily window, IST. Runs late because MCX trades into the night.
      CONNECT_AT: ${CONNECT_AT:-09:00}
      DISCONNECT_AT: ${DISCONNECT_AT:-23:45}
      ALWAYS_SUBSCRIBE: ${ALWAYS_SUBSCRIBE:-NSE|26000}

      # Browsers allowed to open a socket. No wildcards.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://gopocket.in,https://www.gopocket.in,http://localhost:4321}

      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}

      HOST: 0.0.0.0
      PORT: 8090
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-8}
      MAX_TOKENS_PER_CLIENT: ${MAX_TOKENS_PER_CLIENT:-120}

    ports:
      # Published on every interface, so the host firewall is the boundary
      # rather than a compose default that is easy to forget is there.
      #
      # In production the hub belongs behind a TLS-terminating reverse proxy - a
      # browser on an https page cannot open a ws:// socket - so once that proxy
      # is in place set BIND_ADDR=127.0.0.1 to stop publishing to the LAN. If the
      # proxy is itself a container, drop this ports block entirely and let it
      # reach feed-hub:8090 over the docker network.
      - "${BIND_ADDR:-0.0.0.0}:8090:8090"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
