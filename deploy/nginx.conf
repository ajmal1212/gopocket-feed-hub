# /etc/nginx/sites-available/feed-hub
#
# Do NOT use feed.gopocket.in for this - that hostname is the upstream Noren
# feed. Pick something else; mktfeed.gopocket.in is used here.

server {
    listen 443 ssl http2;
    server_name mktfeed.gopocket.in;

    ssl_certificate     /etc/letsencrypt/live/mktfeed.gopocket.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mktfeed.gopocket.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Without these the WebSocket upgrade never reaches the hub.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A quiet market can go minutes without a print; the default 60s would
        # cut the connection and make the site look broken at lunchtime.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name mktfeed.gopocket.in;
    return 301 https://$host$request_uri;
}
